<span class="ui-alert__icon" aria-hidden="true">
  <app-ui-icon [name]="icon()" [size]="18" />
</span>
<div class="ui-alert__content">
  <ng-content />
</div>
@if (dismissible()) {
  <button type="button" class="ui-alert__close" aria-label="Cerrar aviso" (click)="dismiss()">
    <app-ui-icon name="x" [size]="16" />
  </button>
}
